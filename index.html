<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyPulse - Focus & Time Tracker</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans">

    <!-- Navbar -->
    <header class="bg-slate-800 border-b border-slate-700 py-4 px-6 flex justify-between items-center shadow-md">
        <h1 class="text-xl font-bold text-indigo-400 flex items-center gap-2">
            ⏱️ StudyPulse Tracker
        </h1>
        <div class="flex gap-2">
            <button onclick="switchTab('timer')" id="btn-timer" class="px-4 py-2 bg-indigo-600 rounded-lg text-sm font-medium transition">Timer</button>
            <button onclick="switchTab('tasks')" id="btn-tasks" class="px-4 py-2 bg-slate-700 rounded-lg text-sm font-medium hover:bg-slate-600 transition">Tasks & Subjects</button>
            <button onclick="switchTab('analytics')" id="btn-analytics" class="px-4 py-2 bg-slate-700 rounded-lg text-sm font-medium hover:bg-slate-600 transition">Analytics</button>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-4xl mx-auto p-6">

        <!-- TAB 1: TIMER -->
        <section id="tab-timer" class="space-y-6">
            <div class="bg-slate-800 p-8 rounded-2xl shadow-xl text-center border border-slate-700 max-w-lg mx-auto">
                <div class="flex justify-center gap-4 mb-6">
                    <button onclick="setMode('pomodoro')" id="mode-pomo" class="px-3 py-1 bg-indigo-600 rounded-full text-xs font-semibold">Pomodoro (25m)</button>
                    <button onclick="setMode('shortBreak')" id="mode-short" class="px-3 py-1 bg-slate-700 rounded-full text-xs font-semibold">Short Break (5m)</button>
                    <button onclick="setMode('longBreak')" id="mode-long" class="px-3 py-1 bg-slate-700 rounded-full text-xs font-semibold">Long Break (15m)</button>
                </div>

                <!-- Subject Selector for Timer -->
                <div class="mb-6">
                    <label class="block text-xs text-slate-400 mb-2">Select Subject for this session:</label>
                    <select id="timer-subject" class="bg-slate-900 border border-slate-700 rounded-lg px-4 py-2 text-sm w-full text-slate-200 focus:outline-none focus:border-indigo-500">
                        <!-- Populated dynamically -->
                    </select>
                </div>

                <!-- Timer Display -->
                <div id="timer-display" class="text-6xl font-mono font-bold tracking-wider mb-8 text-indigo-300">25:00</div>

                <!-- Controls -->
                <div class="flex justify-center gap-4">
                    <button onclick="startTimer()" id="start-btn" class="px-6 py-2.5 bg-emerald-600 hover:bg-emerald-500 rounded-xl font-semibold transition shadow-lg">Start</button>
                    <button onclick="pauseTimer()" class="px-6 py-2.5 bg-amber-600 hover:bg-amber-500 rounded-xl font-semibold transition shadow-lg">Pause</button>
                    <button onclick="resetTimer()" class="px-6 py-2.5 bg-rose-600 hover:bg-rose-500 rounded-xl font-semibold transition shadow-lg">Reset</button>
                </div>
            </div>
        </section>

        <!-- TAB 2: TASKS & SUBJECTS -->
        <section id="tab-tasks" class="hidden space-y-6">
            <div class="grid md:grid-cols-2 gap-6">
                <!-- Add Subject -->
                <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-lg">
                    <h2 class="text-lg font-semibold mb-4 text-indigo-400">Add New Subject</h2>
                    <div class="flex gap-2">
                        <input type="text" id="subject-input" placeholder="e.g. Physics, Math..." class="bg-slate-900 border border-slate-700 rounded-lg px-4 py-2 text-sm flex-1 text-slate-200 focus:outline-none focus:border-indigo-500">
                        <button onclick="addSubject()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 rounded-lg text-sm font-semibold transition">Add</button>
                    </div>
                    <div id="subjects-list" class="mt-4 flex flex-wrap gap-2">
                        <!-- Chips -->
                    </div>
                </div>

                <!-- Add Task -->
                <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-lg">
                    <h2 class="text-lg font-semibold mb-4 text-indigo-400">Add Study Task</h2>
                    <div class="space-y-3">
                        <input type="text" id="task-input" placeholder="Task description..." class="bg-slate-900 border border-slate-700 rounded-lg px-4 py-2 text-sm w-full text-slate-200 focus:outline-none focus:border-indigo-500">
                        <select id="task-subject" class="bg-slate-900 border border-slate-700 rounded-lg px-4 py-2 text-sm w-full text-slate-200 focus:outline-none focus:border-indigo-500">
                            <!-- Populated -->
                        </select>
                        <button onclick="addTask()" class="w-full py-2 bg-indigo-600 hover:bg-indigo-500 rounded-lg text-sm font-semibold transition">Add Task</button>
                    </div>
                </div>
            </div>

            <!-- Task List Table -->
            <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-lg">
                <h2 class="text-lg font-semibold mb-4 text-slate-200">Your Tasks</h2>
                <div id="tasks-container" class="space-y-2">
                    <!-- Tasks rendered here -->
                </div>
            </div>
        </section>

        <!-- TAB 3: ANALYTICS -->
        <section id="tab-analytics" class="hidden space-y-6">
            <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-lg">
                <h2 class="text-lg font-semibold mb-4 text-indigo-400">Study Analytics & Summary</h2>
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-6">
                    <div class="bg-slate-900 p-4 rounded-xl border border-slate-700 text-center">
                        <p class="text-xs text-slate-400">Total Focused Time</p>
                        <p id="stat-total-time" class="text-2xl font-bold text-emerald-400 mt-1">0 mins</p>
                    </div>
                    <div class="bg-slate-900 p-4 rounded-xl border border-slate-700 text-center">
                        <p class="text-xs text-slate-400">Completed Sessions</p>
                        <p id="stat-sessions" class="text-2xl font-bold text-indigo-400 mt-1">0</p>
                    </div>
                    <div class="bg-slate-900 p-4 rounded-xl border border-slate-700 text-center">
                        <p class="text-xs text-slate-400">Completed Tasks</p>
                        <p id="stat-tasks" class="text-2xl font-bold text-amber-400 mt-1">0</p>
                    </div>
                </div>

                <!-- Backup & Export -->
                <div class="flex gap-4 pt-4 border-t border-slate-700">
                    <button onclick="exportData()" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 rounded-lg text-sm font-medium transition">📥 Export Data (JSON)</button>
                    <button onclick="clearData()" class="px-4 py-2 bg-rose-900/40 hover:bg-rose-900/60 text-rose-300 rounded-lg text-sm font-medium transition">🗑️ Reset All Data</button>
                </div>
            </div>
        </section>

    </main>

    <!-- JavaScript Logic -->
    <script>
        // App State
        let state = JSON.parse(localStorage.getItem('studypulse_state')) || {
            subjects: ['Physics', 'Mathematics', 'Chemistry'],
            tasks: [],
            stats: { totalMinutes: 0, sessions: 0 },
            timer: { mode: 'pomodoro', timeLeft: 1500, running: false }
        };

        let timerInterval = null;

        function saveState() {
            localStorage.setItem('studypulse_state', JSON.stringify(state));
        }

        // Tab Navigation
        function switchTab(tab) {
            ['timer', 'tasks', 'analytics'].forEach(t => {
                document.getElementById(`tab-${t}`).classList.add('hidden');
                document.getElementById(`btn-${t}`).className = "px-4 py-2 bg-slate-700 rounded-lg text-sm font-medium hover:bg-slate-600 transition";
            });
            document.getElementById(`tab-${tab}`).classList.remove('hidden');
            document.getElementById(`btn-${tab}`).className = "px-4 py-2 bg-indigo-600 rounded-lg text-sm font-medium transition";
            if(tab === 'analytics') updateAnalytics();
        }

        // Timer Logic
        function setMode(mode) {
            pauseTimer();
            state.timer.mode = mode;
            if(mode === 'pomodoro') state.timer.timeLeft = 1500;
            if(mode === 'shortBreak') state.timer.timeLeft = 300;
            if(mode === 'longBreak') state.timer.timeLeft = 900;
            
            ['pomo', 'short', 'long'].forEach(m => document.getElementById(`mode-${m}`).className = "px-3 py-1 bg-slate-700 rounded-full text-xs font-semibold");
            document.getElementById(`mode-${mode === 'pomodoro' ? 'pomo' : mode === 'shortBreak' ? 'short' : 'long'}`).className = "px-3 py-1 bg-indigo-600 rounded-full text-xs font-semibold";
            updateTimerDisplay();
        }

        function updateTimerDisplay() {
            const mins = Math.floor(state.timer.timeLeft / 60);
            const secs = state.timer.timeLeft % 60;
            document.getElementById('timer-display').innerText = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }

        function startTimer() {
            if(timerInterval) return;
            timerInterval = setInterval(() => {
                if(state.timer.timeLeft > 0) {
                    state.timer.timeLeft--;
                    updateTimerDisplay();
                } else {
                    clearInterval(timerInterval);
                    timerInterval = null;
                    alert('Session completed! Great job.');
                    if(state.timer.mode === 'pomodoro') {
                        state.stats.totalMinutes += 25;
                        state.stats.sessions += 1;
                        saveState();
                    }
                }
            }, 1000);
        }

        function pauseTimer() {
            clearInterval(timerInterval);
            timerInterval = null;
        }

        function resetTimer() {
            pauseTimer();
            setMode(state.timer.mode);
        }

        // Subjects & Tasks
        function renderSubjects() {
            const listEl = document.getElementById('subjects-list');
            const selectTimer = document.getElementById('timer-subject');
            const selectTask = document.getElementById('task-subject');
            
            listEl.innerHTML = '';
            selectTimer.innerHTML = '';
            selectTask.innerHTML = '';

            state.subjects.forEach(sub => {
                listEl.innerHTML += `<span class="px-3 py-1 bg-slate-700 rounded-full text-xs font-medium">${sub}</span>`;
                selectTimer.innerHTML += `<option value="${sub}">${sub}</option>`;
                selectTask.innerHTML += `<option value="${sub}">${sub}</option>`;
            });
        }

        function addSubject() {
            const input = document.getElementById('subject-input');
            const val = input.value.trim();
            if(val && !state.subjects.includes(val)) {
                state.subjects.push(val);
                input.value = '';
                saveState();
                renderSubjects();
            }
        }

        function addTask() {
            const input = document.getElementById('task-input');
            const subSelect = document.getElementById('task-subject');
            const text = input.value.trim();
            if(text) {
                state.tasks.push({ id: Date.now(), text, subject: subSelect.value, completed: false });
                input.value = '';
                saveState();
                renderTasks();
            }
        }

        function toggleTask(id) {
            const task = state.tasks.find(t => t.id === id);
            if(task) {
                task.completed = !task.completed;
                saveState();
                renderTasks();
            }
        }

        function deleteTask(id) {
            state.tasks = state.tasks.filter(t => t.id !== id);
            saveState();
            renderTasks();
        }

        function renderTasks() {
            const container = document.getElementById('tasks-container');
            container.innerHTML = '';
            if(state.tasks.length === 0) {
                container.innerHTML = `<p class="text-xs text-slate-500 text-center py-4">No tasks added yet.</p>`;
                return;
            }
            state.tasks.forEach(t => {
                container.innerHTML += `
                    <div class="flex items-center justify-between bg-slate-900 p-3 rounded-xl border border-slate-700">
                        <div class="flex items-center gap-3">
                            <input type="checkbox" ${t.completed ? 'checked' : ''} onclick="toggleTask(${t.id})" class="w-4 h-4 accent-indigo-600 rounded">
                            <span class="text-sm ${t.completed ? 'line-through text-slate-500' : 'text-slate-200'}">${t.text}</span>
                            <span class="text-[10px] bg-indigo-900/60 text-indigo-300 px-2 py-0.5 rounded">${t.subject}</span>
                        </div>
                        <button onclick="deleteTask(${t.id})" class="text-rose-400 hover:text-rose-300 text-xs">Delete</button>
                    </div>
                `;
            });
        }

        // Analytics
        function updateAnalytics() {
            document.getElementById('stat-total-time').innerText = `${state.stats.totalMinutes} mins`;
            document.getElementById('stat-sessions').innerText = state.stats.sessions;
            const completedTasks = state.tasks.filter(t => t.completed).length;
            document.getElementById('stat-tasks').innerText = completedTasks;
        }

        // Backup / Export
        function exportData() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(state, null, 2));
            const dlAnchor = document.createElement('a');
            dlAnchor.setAttribute("href", dataStr);
            dlAnchor.setAttribute("download", "studypulse_backup.json");
            document.body.appendChild(dlAnchor);
            dlAnchor.click();
            dlAnchor.remove();
        }

        function clearData() {
            if(confirm('Are you sure you want to reset all progress and tasks?')) {
                localStorage.removeItem('studypulse_state');
                location.reload();
            }
        }

        // Initial Load
        renderSubjects();
        renderTasks();
        updateTimerDisplay();
    </script>
</body>
</html>
